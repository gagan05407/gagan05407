<svg width="100%" height="180" viewBox="0 0 800 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="45%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="45%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#c7d2fe" />
    </linearGradient>

    <!-- Indigo Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0" />
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGradDark); }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 40px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 500;
      font-size: 15px;
      letter-spacing: 1px;
      fill: #c7d2fe;
    }
    .badge-rect { fill: #1e1b4b; stroke: #6366f1; stroke-width: 1; }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.5px;
      fill: #a5b4fc;
    }
    .border-stroke { stroke: #312e81; stroke-width: 1.5; }

    @media (prefers-color-scheme: light) {
      .bg { fill: url(#bgGradLight); }
      .title-text { fill: #1e1b4b; }
      .subtitle-text { fill: #4338ca; }
      .badge-rect { fill: #ffffff; stroke: #6366f1; }
      .badge-text { fill: #4f46e5; }
      .border-stroke { stroke: #c7d2fe; }
    }
  </style>

  <!-- Card Background with Rounded Borders -->
  <rect class="bg border-stroke" x="1" y="1" width="798" height="178" rx="14" />

  <!-- Ambient Glow Behind Name -->
  <circle cx="400" cy="70" r="130" fill="url(#glowGrad)" filter="url(#glowFilter)" />

  <!-- Decorative Wave / Tech Curves at Bottom -->
  <path d="M 0 148 C 160 128, 280 168, 440 144 C 600 120, 680 155, 800 140 L 800 180 L 0 180 Z" fill="url(#waveGrad)" opacity="0.35" />
  <path d="M 0 156 C 200 140, 360 172, 540 150 C 660 136, 740 162, 800 152 L 800 180 L 0 180 Z" fill="url(#waveGrad)" opacity="0.7" />

  <!-- Pill Badge: Status -->
  <g transform="translate(325, 22)">
    <rect class="badge-rect" x="0" y="0" width="150" height="24" rx="12" />
    <circle cx="12" cy="12" r="4" fill="#10b981" />
    <text class="badge-text" x="24" y="16">SYSTEMS &amp; APIS</text>
  </g>

  <!-- Header Main Title -->
  <text class="title-text" x="400" y="86" text-anchor="middle">GAGAN GAUR</text>

  <!-- Subtitle -->
  <text class="subtitle-text" x="400" y="118" text-anchor="middle">SOFTWARE ENGINEER &bull; AI, BACKEND &amp; FULL-STACK</text>
</svg>
